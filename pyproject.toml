[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slr-watch"
version = "0.1.0"
description = "Public-data analysis of bank leverage constraints and Treasury holdings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "PyYAML>=6.0",
  "requests>=2.32",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
browser = ["playwright>=1.58"]

[project.scripts]
slr-watch = "slr_watch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "-m", "not integration"]
markers = ["integration: requires locally rebuilt empirical reports"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Explicit correctness checks independent of Ruff version defaults.
select = ["E4", "E7", "E9", "F"]
